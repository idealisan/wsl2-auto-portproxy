name: release

# Build and publish all binaries on every version tag (v*).
# Matrix: windows / linux / darwin x amd64 / arm64 = 6 combos,
# each producing wslpp and wslpp-agent = 12 release files. The GUI is built
# for windows and darwin: two .exe, two macOS .app.zip bundles and one .ico,
# for 17 files total.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      # go.sum is generated here rather than committed locally.
      - run: go mod tidy
      - run: go vet ./...
      - run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [windows, linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - run: go mod tidy
      - name: Build wslpp and wslpp-agent
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          LDFLAGS="-s -w -X main.version=$VERSION"
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          mkdir -p dist
          go build -ldflags "$LDFLAGS" -o "dist/wslpp-$GOOS-$GOARCH$EXT" .
          go build -ldflags "$LDFLAGS" -o "dist/wslpp-agent-$GOOS-$GOARCH$EXT" ./cmd/agent
          ls -la dist
      - name: Build GUI (windows and darwin)
        if: matrix.goos == 'windows' || matrix.goos == 'darwin'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          LDFLAGS="-s -w -X github.com/egoist/mygo.production=1 -X main.version=$VERSION"
          # The icon generator is a host tool: run it on the Linux runner.
          mkdir -p build/icons
          GOOS=linux GOARCH=amd64 go run ./tools/genicon -out build/icons

          if [ "$GOOS" = "windows" ]; then
            go build -trimpath -tags mygo_noinspector \
              -ldflags "$LDFLAGS -H=windowsgui" \
              -o "dist/wslpp-gui-windows-$GOARCH.exe" ./cmd/gui
            if [ "$GOARCH" = "amd64" ]; then
              cp build/icons/icon.ico dist/wslpp-gui.ico
            fi
          else
            go build -trimpath -tags mygo_noinspector \
              -ldflags "$LDFLAGS" \
              -o "dist/wslpp-gui-darwin-$GOARCH" ./cmd/gui
            APP="dist/wslpp-gui.app"
            mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
            cp "dist/wslpp-gui-darwin-$GOARCH" "$APP/Contents/MacOS/wslpp-gui"
            cp build/icons/icon.icns "$APP/Contents/Resources/wslpp-gui.icns"
            sed "s/@VERSION@/$VERSION/" deploy/Info.plist > "$APP/Contents/Info.plist"
            chmod +x "$APP/Contents/MacOS/wslpp-gui"
            (cd dist && zip -qr "wslpp-gui-darwin-$GOARCH.app.zip" wslpp-gui.app)
            rm -rf "$APP" "dist/wslpp-gui-darwin-$GOARCH"
          fi
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: bins-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: bins-*
          merge-multiple: true
          path: dist
      - run: ls -la dist
      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes dist/*
